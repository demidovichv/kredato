# kredato.com — daily rates update from CBR + Banki.ru
# Runs at 03:00 UTC = 06:00 MSK
name: daily-rates
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git repo
          cd repo
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install requests lxml beautifulsoup4
          
      - name: Fetch and normalize rates
        run: |
          cd repo
          python scripts/update_rates.py
          
      - name: Commit and push rates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          git config user.name "kredato-bot"
          git config user.email "bot@kredato.com"
          
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add site/assets/data/rates.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update rates $(date +%Y-%m-%d)"
          git push
